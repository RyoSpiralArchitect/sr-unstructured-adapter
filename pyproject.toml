# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "sr-unstructured-adapter"
version = "0.2.4"
description = "Transform unstructured files into a unified JSON payload"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "SpiralReality"}]
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "pypdf>=3.0",
    "python-docx>=0.8",
    "openpyxl>=3.1",
    "Pillow>=9.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sentry-sdk>=1.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-benchmark>=4.0",
    "pyperf>=2.6",
    "pytest-mock>=3.12",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
sr-adapt = "sr_adapter.cli:main"
sr-adapt-api = "sr_adapter.api:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["-q"]
testpaths = ["tests"]
norecursedirs = [
    "sr-unstructured-adapter",
    "sr-unstructured-adapter-review",
    ".venv",
    "build",
    "dist",
]
markers = [
    "perf: performance benchmark suite",
]
