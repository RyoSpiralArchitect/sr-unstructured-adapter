# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "sr-unstructured-adapter"
version = "0.2.6"
description = "Transform unstructured files into a unified JSON payload"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "SpiralReality"}]
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "pypdf>=3.0",
    "python-docx>=0.8",
    "openpyxl>=3.1",
    "Pillow>=9.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sentry-sdk>=1.39",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
tables = ["pdfplumber>=0.11,<0.12"]
lakehouse = ["pyarrow>=18"]
azure = ["azure-storage-file-datalake>=12.16,<13", "azure-identity>=1.17,<2"]
foundry = ["azure-identity>=1.17,<2"]
fabric = ["azure-identity>=1.17,<2", "pyarrow>=18"]
evaluation = [
    "reportlab>=4.0",
    "pdfplumber>=0.11,<0.12",
]
dev = [
    # pytest-benchmark 5.3.0 still reads Node._nodeid, removed in pytest 9.2.
    "pytest>=7.4,<9.2",
    "pytest-benchmark>=4.0",
    "pyperf>=2.6",
    "pytest-mock>=3.12",
    "reportlab>=4.0",
    "pdfplumber>=0.11,<0.12",
    "pyarrow>=18",
    "rdflib>=7",
    "azure-storage-file-datalake>=12.16,<13",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
sr-adapt = "sr_adapter.cli:main"
sr-adapt-api = "sr_adapter.api:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sr_adapter = ["native/*.cpp", "recipes/*.yaml", "configs/tenants/*.yaml"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["-q"]
testpaths = ["tests"]
norecursedirs = [
    "sr-unstructured-adapter",
    "sr-unstructured-adapter-review",
    ".venv",
    "build",
    "dist",
]
markers = [
    "perf: performance benchmark suite",
]
