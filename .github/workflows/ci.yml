name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            disable_native: "1"
          - os: ubuntu-latest
            python: "3.11"
            disable_native: "0"
          - os: ubuntu-latest
            python: "3.13"
            disable_native: "0"
          - os: windows-latest
            python: "3.11"
            disable_native: "0"
    defaults:
      run:
        shell: bash
    env:
      SR_ADAPTER_DISABLE_NATIVE_RUNTIME: ${{ matrix.disable_native }}
      SR_ADAPTER_DISABLE_LAYOUT_CACHE: "1"
      SR_ADAPTER_PROFILE_AUTOMATION__ENABLED: "false"
      SR_ADAPTER_KERNEL_AUTOTUNE__ENABLED: "false"
      PYTHONWARNINGS: "default"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -e '.[dev,api]' ruff build
      - name: Lint
        run: ruff check .
      - name: Test core, API, and provider protocols without network
        run: pytest -q --benchmark-disable
      - name: Build and verify installed wheel away from checkout
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          SR_ADAPTER_NATIVE_CACHE="$RUNNER_TEMP/wheel-native" python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from sr_adapter import Block, OntologyMapping, extract_pdf_tables, extract_knowledge
          from sr_adapter.knowledge_store import export_bundle, write_sqlite
          from sr_adapter.foundry import export_foundry, verify_foundry
          from sr_adapter.pipeline import convert
          from sr_adapter.recipe import load_recipe
          from sr_adapter.drivers.manager import TenantManager
          from sr_adapter.native import ensure_text_kernel, ensure_layout_kernel
          assert load_recipe("default")
          assert "default" in TenantManager().list_tenants()
          if os.environ.get("SR_ADAPTER_DISABLE_NATIVE_RUNTIME") != "1":
              assert ensure_text_kernel()
              assert ensure_layout_kernel()
          with TemporaryDirectory() as directory:
              source = Path(directory) / "sample.txt"
              source.write_text("wheel ready", encoding="utf-8")
              document = convert(source, "default", llm_ok=False)
              assert any(block.text == "wheel ready" for block in document.blocks)
              from reportlab.pdfgen import canvas
              from reportlab.platypus import Table, TableStyle
              pdf = Path(directory) / "table.pdf"
              writer = canvas.Canvas(str(pdf))
              table = Table([["Project", "Owner"], ["Alpha", "Ops"]])
              table.setStyle(TableStyle([("GRID", (0, 0), (-1, -1), 1, "black")]))
              table.wrap(500, 500)
              table.drawOn(writer, 30, 500)
              writer.save()
              mapping = OntologyMapping(namespace="urn:test:", classes={"Team": "Team", "Project": "Project"},
                  entities=[{"key": "project", "column": "Project", "class_id": "Project"},
                            {"key": "owner", "column": "Owner", "class_id": "Team"}],
                  relations=[{"predicate": "ownedBy", "subject": "project", "object": "owner"}])
              package = extract_knowledge(extract_pdf_tables(pdf), mapping)
              assert len(package.entities) == 2 and len(package.relations) == 1
              bundle, database = Path(directory) / "bundle", Path(directory) / "knowledge.sqlite3"
              export_bundle(package, bundle, parquet=True)
              assert write_sqlite(bundle, database)["inserted"] > 0
              assert write_sqlite(bundle, database)["inserted"] == 0
              foundry = Path(directory) / "foundry"
              manifest = export_foundry([bundle], foundry)
              assert manifest["card_count"] == 1
              assert verify_foundry(foundry)[0] == manifest
          print(Block(text="wheel ready"))
          PY
